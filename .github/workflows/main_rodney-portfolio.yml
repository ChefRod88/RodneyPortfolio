# Docs for Cloudflare Wrangler Action: https://github.com/cloudflare/wrangler-action

name: Build, test, and deploy portfolio to Cloudflare - rodney-portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker + assets build
        run: npx wrangler deploy --dry-run

      - name: Run tests
        run: npm run test:js

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_test
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 'latest'


